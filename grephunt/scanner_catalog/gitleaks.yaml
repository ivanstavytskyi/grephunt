name: gitleaks
module: sast
category: secret
binary: gitleaks
image: ghcr.io/gitleaks/gitleaks:v8.30.1
version: "8.30.1"
timeout_sec: 1200
network: false
user: "65534"
cpus: "2"
memory: 2g
pids_limit: 256
args:
  - dir
  - "{src}"
  - --report-format
  - sarif
  - --report-path
  - "{output}"
  # The report says where a secret is, not what it is.
  - --redact
  - --no-banner
  - --exit-code
  - "0"
  - --log-level
  - warn
output_filename: gitleaks.sarif
ok_exit_codes: [0]
# The SARIF driver version is always v8.0.0.
trust_reported_version: false
target_mount: /src
output_mount: /out
environment:
  HOME: /tmp
cap_drop:
  - ALL
no_new_privileges: true
