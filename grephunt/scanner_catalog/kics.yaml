name: kics
module: sast
category: misconfig
binary: kics
image: checkmarx/kics:v2.1.15
version: "2.1.15"
timeout_sec: 1800
network: false
user: "65534"
cpus: "2"
memory: 2g
pids_limit: 256
args:
  - scan
  - -p
  - "{src}"
  - -o
  - "{out_dir}"
  - --report-formats
  - sarif
  - --output-name
  - kics
  - --no-progress
output_filename: kics.sarif
# 50 means vulnerabilities were found.
ok_exit_codes: [0, 50]
target_mount: /src
output_mount: /out
environment:
  HOME: /tmp
cap_drop:
  - ALL
no_new_privileges: true
# Off by default: another default tool covers this category (see scanner_catalog/ui.yaml).
default_enabled: false
