name: secretlint
module: sast
category: secret
binary: secretlint
image: ghcr.io/secretlint/secretlint:v13.1.0
version: "13.1.0"
timeout_sec: 1200
network: false
user: "65534"
cpus: "2"
memory: 2g
pids_limit: 256
args:
  - "{src}/**/*"
  - --format
  - json
  - --output
  - "{output}"
  - --no-color
  # Uploaded folders often hold .env files that .gitignore hides. Scan them too.
  - --no-gitignore
  - --secretlintignore
  - "{catalog}/config/secretlintignore"
  - --secretlintrcJSON
  - '{"rules":[{"id":"@secretlint/secretlint-rule-preset-recommend"}]}'
output_format: secretlint-json
raw_output_filename: secretlint.json
output_filename: secretlint.sarif
ok_exit_codes: [0, 1]
target_mount: /src
output_mount: /out
environment:
  HOME: /tmp
cap_drop:
  - ALL
no_new_privileges: true
