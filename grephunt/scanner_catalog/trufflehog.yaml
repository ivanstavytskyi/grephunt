name: trufflehog
module: sast
category: secret
binary: trufflehog
image: trufflesecurity/trufflehog:3.99.7
version: "3.99.7"
timeout_sec: 1800
# Key verification is the "verify" parameter below: a person sees it on the scan form and
# can turn it off. With it off the hook adds --no-verification and keeps the network closed.
network: true
user: "65534"
cpus: "2"
memory: 2g
pids_limit: 256
args:
  - filesystem
  - "{src}"
  - --json
  - --no-verification
  - --no-update
image_args:
  - docker
  - --image
  - "file://{src}"
  - --json
  - --no-verification
  - --no-update
output_source: stdout
output_format: trufflehog-jsonl
raw_output_filename: trufflehog.jsonl
output_filename: trufflehog.sarif
# 183 is "results found" when --fail is given; it is accepted in case a config sets it.
ok_exit_codes: [0, 183]
target_mount: /src
output_mount: /out
environment:
  HOME: /tmp
parameters:
  - name: verify
    type: bool
    label: Check whether found keys are live
    description: >-
      TruffleHog tries each key against its own service (AWS, GitHub, Slack and others) and marks
      the ones that work. Keys it checked that do not work move to "Needs review". Turn this off for
      code you do not own: many bug bounty programs forbid using credentials found in a target.
    default: true
cap_drop:
  - ALL
no_new_privileges: true
