name: trufflehog
module: sast
category: secret
binary: trufflehog
image: trufflesecurity/trufflehog:3.99.7
version: "3.99.7"
timeout_sec: 1800
# --no-verification: TruffleHog does not try the keys against the providers' APIs.
# Checking a client's live credentials is a decision for a person, not a default.
network: false
user: "65534"
cpus: "2"
memory: 2g
pids_limit: 256
args:
  - filesystem
  - "{src}"
  - --json
  - --no-verification
  - --no-update
image_args:
  - docker
  - --image
  - "file://{src}"
  - --json
  - --no-verification
  - --no-update
output_source: stdout
output_format: trufflehog-jsonl
raw_output_filename: trufflehog.jsonl
output_filename: trufflehog.sarif
# 183 is "results found" when --fail is given; it is accepted in case a config sets it.
ok_exit_codes: [0, 183]
target_mount: /src
output_mount: /out
environment:
  HOME: /tmp
cap_drop:
  - ALL
no_new_privileges: true
