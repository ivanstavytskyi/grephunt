name: zizmor
module: sast
category: misconfig
binary: zizmor
image: ghcr.io/zizmorcore/zizmor:1.31.1
version: "1.31.1"
timeout_sec: 900
network: false
user: "65534"
cpus: "1"
memory: 512m
pids_limit: 128
applies_to: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
args:
  - --offline
  - --format=sarif
  - "{src}"
output_source: stdout
output_filename: zizmor.sarif
ok_exit_codes: [0]
target_mount: /src
output_mount: /out
environment:
  HOME: /tmp
cap_drop:
  - ALL
no_new_privileges: true
