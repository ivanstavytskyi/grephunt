[project]
name = "grephunt"
version = "0.2.0"
description = "Vulnerability detection core: one finding record, scanner descriptors, isolated runs."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
grephunt = "grephunt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a running Docker daemon and the scanner images",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grephunt*"]

[tool.setuptools.package-data]
grephunt = ["scanner_catalog/*.yaml", "finding_model/*.json"]
